name: 'Switchyard Router'
description: >-
  Run the NVIDIA NeMo Switchyard router in your job to auto-route AI tasks
  between strong/weak models, with per-run routing stats saved as artifacts.
  Client-agnostic: anything that speaks the OpenAI or Anthropic API can use it.
author: 'shuntaka9576'
branding:
  icon: 'shuffle'
  color: 'green'

inputs:
  fireworks-api-key:
    description: 'Fireworks API key (passed only into the router container)'
    required: true
  task-label:
    description: 'Task label recorded on every routing record, for aggregation and misroute analysis'
    required: false
    default: ''
  route-config:
    description: 'Path to a route.yaml overriding the default bundled in the image'
    required: false
    default: ''
  image:
    description: 'Router container image'
    required: false
    default: 'ghcr.io/shuntaka9576/switchyard:latest'
  port:
    description: 'Host port for the router (loopback only)'
    required: false
    default: '4100'
  extra-docker-args:
    description: 'Extra whitespace-separated arguments appended to docker run (e.g. --add-host=host.docker.internal:host-gateway)'
    required: false
    default: ''
  price-strong-per-mtok:
    description: 'USD per 1M tokens for the strong model, used for cost estimation'
    required: false
    default: '1.05'
  price-weak-per-mtok:
    description: 'USD per 1M tokens for the weak model, used for cost estimation'
    required: false
    default: '0.15'

outputs:
  base-url:
    description: 'Router endpoint (http://127.0.0.1:<port>/v1)'
  strong-requests:
    description: 'Requests routed to the strong tier (set by the post step; informational)'
  weak-requests:
    description: 'Requests routed to the weak tier (set by the post step; informational)'
  total-tokens:
    description: 'Total tokens across all routed requests (set by the post step; informational)'
  estimated-cost-usd:
    description: 'Estimated cost in USD (set by the post step; informational)'
  estimated-savings-usd:
    description: 'Estimated savings vs strong-only in USD (set by the post step; informational)'

runs:
  using: 'node24'
  main: 'dist/main.js'
  post: 'dist/post.js'
  post-if: 'always()'
