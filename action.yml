name: 'Switchyard Router'
description: >-
  Run the NVIDIA NeMo Switchyard router in your job to auto-route AI tasks
  between model tiers you define in a route bundle, with per-run routing
  stats saved as artifacts. Client-agnostic and provider-agnostic.
author: 'shuntaka9576'
branding:
  icon: 'shuffle'
  color: 'green'

inputs:
  route-config:
    description: 'Path to the Switchyard route bundle (route.yaml) defining providers, models, and routes. Set the env vars its api_key entries reference via env: on this step. See examples/.'
    required: true
  image:
    description: 'Router container image'
    required: false
    default: 'ghcr.io/shuntaka9576/switchyard:latest'
  extra-docker-args:
    description: 'Extra whitespace-separated arguments appended to docker run (e.g. --add-host=host.docker.internal:host-gateway)'
    required: false
    default: ''
  price-strong-per-mtok:
    description: 'USD per 1M tokens for the strong tier. Set both prices to enable cost estimation; omitted, no cost is shown.'
    required: false
    default: ''
  price-weak-per-mtok:
    description: 'USD per 1M tokens for the weak tier. Set both prices to enable cost estimation; omitted, no cost is shown.'
    required: false
    default: ''

outputs:
  base-url:
    description: 'Router endpoint (http://127.0.0.1:4100/v1)'
  strong-requests:
    description: 'Requests routed to the strong tier (set by the post step; informational)'
  weak-requests:
    description: 'Requests routed to the weak tier (set by the post step; informational)'
  total-tokens:
    description: 'Total tokens across all routed requests (set by the post step; informational)'
  estimated-cost-usd:
    description: 'Estimated cost in USD (set by the post step when both price inputs are provided)'
  estimated-savings-usd:
    description: 'Estimated savings vs strong-only in USD (set by the post step when both price inputs are provided)'

runs:
  using: 'node24'
  main: 'dist/main.js'
  post: 'dist/post.js'
  post-if: 'always()'
