name: Publish router image
on:
  workflow_dispatch:
  schedule:
    # Weekly rebuild picks up base-image security fixes.
    - cron: '0 3 * * 1'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: docker
          push: true
          # amd64 covers GitHub-hosted ubuntu runners; add linux/arm64 via
          # a native-runner matrix when arm runners enter the picture.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/switchyard:latest
            ghcr.io/${{ github.repository_owner }}/switchyard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
