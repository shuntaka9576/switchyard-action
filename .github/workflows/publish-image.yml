name: Publish router image
on:
  workflow_dispatch:
  schedule:
    # Weekly rebuild picks up base-image security fixes.
    - cron: '0 3 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          # amd64 covers GitHub-hosted ubuntu runners; add linux/arm64 via
          # a native-runner matrix when arm runners enter the picture.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/switchyard:latest
            ghcr.io/${{ github.repository_owner }}/switchyard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
