name: E2E
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Build router image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: docker
          load: true
          tags: switchyard:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start mock upstream
        run: |
          nohup python3 test/mock_llm.py 9999 > mock.log 2>&1 &
          sleep 1
          curl -sf http://127.0.0.1:9999/health

      - name: Run switchyard-action
        id: router
        uses: ./
        env:
          UPSTREAM_API_KEY: dummy-e2e-key
        with:
          image: switchyard:e2e
          route-config: test/route-ci.yaml
          extra-docker-args: --add-host=host.docker.internal:host-gateway

      - name: Exercise router (weak-only / strong-only / auto)
        env:
          BASE: ${{ steps.router.outputs.base-url }}
        run: |
          set -x
          for model in weak-only strong-only auto; do
            curl -sf -X POST "$BASE/chat/completions" \
              -H 'content-type: application/json' \
              -H 'authorization: Bearer local-dummy' \
              -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}" \
              | jq -e '.usage.total_tokens > 0'
          done

      - name: Check routing stats endpoint
        run: |
          curl -sf http://127.0.0.1:4100/v1/routing/stats | tee /tmp/stats.json
          echo
          cat mock.log

  verify-artifact:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: switchyard-stats-*
          merge-multiple: true
      - name: Assert normalized records exist
        env:
          REPO: ${{ github.repository }}
        run: |
          ls -la
          test -s routing.jsonl
          jq -se 'length >= 3' routing.jsonl
          jq -se --arg repo "$REPO" 'all(.[]; .repo == $repo and .workflow == "E2E" and .total_tokens > 0)' routing.jsonl
          echo "--- records ---"
          cat routing.jsonl
          echo "--- stats ---"
          cat stats.json
